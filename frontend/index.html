<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>BrewOS — Glimpse of Del</title>

    <!-- Theme: paints the phone's status bar Night Market brown -->
    <meta name="theme-color" content="#14100C" />
    <meta
      name="description"
      content="Order and queue management for Glimpse of Del"
    />

    <!-- iOS standalone support (Safari ignores most of the manifest) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BrewOS" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />

    <!-- The saved theme, before first paint. useTheme only runs inside the
         Layout, so without this Login (and any first paint) was always dark.
         Same key and fallback as useTheme; storage can throw when blocked. -->
    <script>
      try {
        var t = localStorage.getItem('brewos-theme')
        document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark')
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark')
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
